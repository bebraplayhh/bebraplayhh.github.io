<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>bebra_playhh</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .main {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 50px;
      padding-top: 180px;
      transform: translateX(-40px);
    }

    .goal {
      font-size: 36px;
      font-weight: bold;
      text-align: right;
      white-space: nowrap;
    }

    .right-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .counter {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 15px 22px;
      border-radius: 15px;
      background: #222;
      font-size: 24px;
      font-weight: bold;
    }

    .label {
      font-size: 16px;
      font-weight: normal;
      opacity: 0.7;
    }

    .youtube-button {
      padding: 12px 25px;
      border-radius: 10px;
      background: #ff0000;
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      transition: transform 0.2s;
    }

    .youtube-button:hover {
      transform: scale(1.05);
    }

    .image {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
    }
  </style>
</head>

<body>

  <div class="main">

    <div class="goal">
      help me hit 1,000 subscribers
    </div>

    <div class="right-side">

      <div class="counter">
        <span>🍌</span>
        <span id="sub-count">Loading...</span>
        <span class="label">subscribers</span>
      </div>

      <a
        class="youtube-button"
        href="https://www.youtube.com/@bebra_playhh"
        target="_blank"
      >
        ▶ Visit my YouTube
      </a>

    </div>

    <img
      class="image"
      src="8708dc41447127278b4bf08d8fbb6936.jpg"
      alt="bebra_playhh"
    >

  </div>

  <script>
    const WORKER_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnQyNL7kfhMA14VwKYkghGoKyge9XxcdSZ3ZCf6J6gMLb_nUiX8vU91N7vBcWsqMY07X9HU3KSHLR29xJOtQbgOHMqrEf2OgVnLilb6NsNKXdjjrvHp9Ld3OMnNwbuo7LFfZEoiQoorqPKcNErOjWg0NJyFy67mOBLHHPXnsDzbysVJ3G0FP6DBKwa6gBesWS0Y89fpET4pIUTuJpGnvHzu9ygNccvPGi8c9Lz1aaoKajKQP0pZRRh05pmHe1TYiFw9imRX_X8zTjkX_DVp7xitgF__x1Q&lib=MNaxVXWUGDRJm86NUt48FJd1S2JIpp1Oo";

    async function updateCounter() {
      try {
        const response = await fetch(WORKER_URL);
        const data = await response.json();

        if (data.subscribers !== undefined) {
          document.getElementById("sub-count").textContent =
            Number(data.subscribers).toLocaleString();
        }
      } catch (error) {
        document.getElementById("sub-count").textContent = "Unavailable";
      }
    }

    updateCounter();
    setInterval(updateCounter, 5 * 60 * 1000);
  </script>

</body>
</html>
